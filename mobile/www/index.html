<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9e3dc" />
  <title>DWP EARN MONEY</title>
  <!--
    The app's opening screen. It is bundled in the APK, so it shows at once: the logo builds
    itself, then the live platform opens behind it. Android keeps this page on screen until the
    platform has drawn, so there is no blank moment in between.
  -->
  <style>
    :root { --ink: #171410; --ink-3: #655c54; --green: #0e8a62; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #e9e3dc;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
    }
    /* Warm, softly moving light behind everything. */
    .glow { position: fixed; inset: -20%; pointer-events: none; animation: drift 9s ease-in-out infinite alternate;
      background:
        radial-gradient(40% 35% at 25% 25%, rgb(255 255 255 / .85), transparent 70%),
        radial-gradient(35% 30% at 78% 30%, rgb(108 201 177 / .32), transparent 70%),
        radial-gradient(45% 40% at 60% 85%, rgb(232 196 160 / .45), transparent 70%); }
    @keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.06); } }

    .stage { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .badge { position: relative; width: 132px; height: 132px; display: grid; place-items: center;
      border-radius: 38px; background: rgb(248 245 241 / .75); border: 1px solid rgb(255 255 255 / .7);
      box-shadow: 0 24px 60px -18px rgb(40 30 20 / .35), inset 0 1px 0 #fff;
      animation: badge .7s cubic-bezier(.22, 1, .36, 1) both; }
    @keyframes badge { from { opacity: 0; transform: scale(.7) translateY(10px); } }
    /* A ring of light that sweeps out once the logo is complete. */
    .badge::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid rgb(18 168 116 / .55);
      opacity: 0; animation: ring 1.1s 1.25s ease-out both; }
    @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.45); } }

    svg { width: 92px; height: 92px; overflow: visible; }
    .draw { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw .55s cubic-bezier(.65, 0, .35, 1) forwards; }
    .d1 { animation-delay: .25s; }
    .d3 { animation-delay: .7s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .45s cubic-bezier(.34, 1.56, .64, 1) forwards; }
    .p2 { animation-delay: .5s; }
    .p4 { animation-delay: .85s; }
    .p5 { animation-delay: 1s; }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    .dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: dot .6s 1.05s cubic-bezier(.34, 1.56, .64, 1) forwards; }
    @keyframes dot { 0% { opacity: 0; transform: translateY(-26px) scale(.5); } 100% { opacity: 1; transform: none; } }
    .logo { animation: float 3.2s 1.6s ease-in-out infinite; transform-origin: center; }
    @keyframes float { 50% { transform: translateY(-5px); } }

    .word { margin-top: 26px; font-size: 26px; letter-spacing: -.02em; font-weight: 600; opacity: 0; animation: rise .6s 1.15s cubic-bezier(.22, 1, .36, 1) forwards; }
    .word b { font-weight: 600; background: linear-gradient(90deg, #0e8a62, #3cc79a, #0e8a62); background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 2.4s 1.6s linear infinite; }
    @keyframes shine { to { background-position: -200% 0; } }
    .tag { margin-top: 6px; font-size: 13px; color: var(--ink-3); opacity: 0; animation: rise .6s 1.3s cubic-bezier(.22, 1, .36, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .bar { margin-top: 26px; width: 150px; height: 4px; border-radius: 99px; background: rgb(40 30 20 / .1); overflow: hidden; opacity: 0; animation: rise .4s 1.4s forwards; }
    .bar i { display: block; height: 100%; width: 40%; border-radius: inherit; background: linear-gradient(90deg, #3fa58c, #127562); animation: load 1.1s 1.4s ease-in-out infinite; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

    .offline { display: none; margin-top: 22px; max-width: 300px; }
    .offline p { margin: 0 0 14px; font-size: 14px; color: var(--ink-3); line-height: 1.5; }
    .offline button { border: 0; font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: #16130f; color: #fff;
      box-shadow: 0 8px 20px rgb(22 19 15 / .28); }
    body.is-offline .bar { display: none; }
    body.is-offline .offline { display: block; animation: rise .4s forwards; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="stage" role="status" aria-live="polite">
    <div class="badge" aria-hidden="true">
      <svg class="logo" viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="back" x1="20" y1="18" x2="70" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#12a874"/><stop offset="0.6" stop-color="#0b7a55"/><stop offset="1" stop-color="#1fae7d"/></linearGradient>
          <linearGradient id="loop" x1="17" y1="84" x2="86" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#19b37f"/><stop offset="0.45" stop-color="#0e8a62"/><stop offset="1" stop-color="#3cc79a"/></linearGradient>
          <linearGradient id="front" x1="14" y1="60" x2="88" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#12a874"/><stop offset="0.45" stop-color="#2cc48f"/><stop offset="1" stop-color="#7ee8c0"/></linearGradient>
          <linearGradient id="fold" x1="36" y1="80" x2="62" y2="54" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#075c41"/><stop offset="1" stop-color="#149a6c"/></linearGradient>
          <linearGradient id="dotg" x1="66" y1="15" x2="76" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6fe3b9"/><stop offset="1" stop-color="#12a874"/></linearGradient>
        </defs>
        <path class="draw d1" d="M27 22 L72 49.5" stroke="url(#back)" stroke-width="17" stroke-linecap="round"/>
        <g class="pop p2">
          <path d="M23 55 L80 53 L40 78 L24 69.5 Z" fill="url(#loop)"/>
          <path d="M80 53 L40 78 L24 69.5 L23 55" stroke="url(#loop)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <path class="pop p4" d="M35.2 67.5 L63.6 52.4 L58.8 73.6 L42 83 L35.2 79.5 Z" fill="url(#fold)"/>
        <path class="draw d3" d="M23 60 L23 55.5 Q23 51 27 48.5 L45 37 Q49.5 34 54 36.4 L81.5 51" stroke="url(#front)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="pop p5" d="M35.2 53.4 L49.2 44.6 L63.6 52.4 L54 53.2 L55 56.2 L35.2 67.5 Z" fill="#ffffff"/>
        <circle class="dot" cx="71.6" cy="24" r="9.6" fill="url(#dotg)"/>
      </svg>
    </div>
    <div class="word">DWP <b>EARN MONEY</b></div>
    <div class="tag" id="tag">Menyiapkan ruang kendali…</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="offline">
      <p>Tidak bisa terhubung ke server. Periksa koneksi internet Anda.</p>
      <button type="button" id="retry">Coba lagi</button>
    </div>
  </main>
  <script>
    (function () {
      var APP = "https://autonomous-sooty.vercel.app/";
      var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      var tag = document.getElementById("tag");

      function offline() {
        document.body.classList.add("is-offline");
        tag.textContent = "Tidak ada koneksi";
      }

      function open() {
        if (navigator.onLine === false) return offline();
        document.body.classList.remove("is-offline");
        tag.textContent = "Menyiapkan ruang kendali…";
        try { sessionStorage.setItem("dwp-opened", String(Date.now())); } catch (e) {}
        // replace(): the back button never returns to this opening screen.
        location.replace(APP);
      }

      document.getElementById("retry").addEventListener("click", open);
      window.addEventListener("online", function () { if (document.body.classList.contains("is-offline")) open(); });

      // Back here moments after leaving means the platform failed to load (the app shows this
      // page on a load error): ask before trying again instead of looping.
      var last = 0;
      try { last = Number(sessionStorage.getItem("dwp-opened")) || 0; } catch (e) {}
      if (Date.now() - last < 20000) offline();
      // Start loading once the logo is built; this screen stays until the platform has drawn.
      else setTimeout(open, reduced ? 100 : 1500);
    })();
  </script>
</body>
</html>
